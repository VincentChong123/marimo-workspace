  #### 1. Add .github/workflows/deploy-pages.yml

  # Create this workflow file in your repository:

  name: Deploy Marimo to GitHub Pages
  
  on:
    push:
      branches: [main]
    workflow_dispatch:
  
  permissions:
    contents: read
    pages: write
    id-token: write
  
  concurrency:
    group: "pages"
    cancel-in-progress: false
  
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
  
        - name: Install uv
          uses: astral-sh/setup-uv@v5
          with:
            enable-cache: true
  
        - name: Export Marimo to WASM HTML
          run: |
            mkdir -p dist
            uv run marimo export html-wasm app.py -o dist/index.html --
mode run
            touch dist/.nojekyll
  
        - name: Upload GitHub Pages artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: dist
  
    deploy:
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      runs-on: ubuntu-latest
      needs: build
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4